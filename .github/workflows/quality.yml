name: Quality checks

on:
  push:
    branches: [foundation/phase-1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install PHP CLI and required extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mysql php-mbstring

      - name: PHP syntax validation
        run: |
          find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax validation
        run: |
          node --check assets/js/app.js
          node --check assets/js/auth.js
          node --check assets/js/admin.js
          node --check assets/js/register.js

      - name: Validate whitespace errors
        run: git diff --check
