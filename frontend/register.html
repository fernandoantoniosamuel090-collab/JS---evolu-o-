<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Criar conta — JS EVOLUÇÃO</title><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/register.js" defer></script></head>
<body class="auth-page"><main class="auth-card"><a class="brand" href="/"><span class="brand-mark">JS</span><span>EVOLUÇÃO</span></a><p class="eyebrow">CRIAR CONTA</p><h1>Comece a evoluir.</h1><p class="muted">Crie uma conta de cliente na JS EVOLUÇÃO.</p><form id="register-form"><label for="full_name">Nome completo</label><input id="full_name" name="full_name" autocomplete="name" required maxlength="160"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="190"><label for="password">Palavra-passe (mínimo 12 caracteres)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required><button class="button button-primary" type="submit">Criar conta →</button><p id="register-message" role="status" aria-live="polite"></p></form><a class="text-link" href="/frontend/login.html">Já tem conta? Iniciar sessão</a></main></body></html>
